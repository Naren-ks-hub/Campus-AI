# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration (Change username and password to your MySQL credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/campusai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Application Info
campusai.app.name=CampusAI College Management Assistant
campusai.ai.version=2.5
