<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal - CampusAI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div class="glass-card" style="width: 100%; max-width: 460px; padding: 36px; position: relative;">
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" class="brand" style="justify-content: center; margin-bottom: 12px;">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span>Campus<span class="gradient-text">AI</span></span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your smart campus dashboard</p>
    </div>

    <!-- Role Selection Tabs -->
    <div style="display: flex; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 1px solid var(--border-glass);">
      <button class="role-tab active" data-role="STUDENT" style="flex: 1; padding: 8px; border: none; background: var(--primary); color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-user-graduate"></i> Student
      </button>
      <button class="role-tab" data-role="FACULTY" style="flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-chalkboard-user"></i> Faculty
      </button>
      <button class="role-tab" data-role="ADMIN" style="flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </button>
    </div>

    <!-- Continue with Google Button -->
    <button type="button" id="google-login-btn" class="btn btn-secondary" style="width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 0.92rem; color: #fff; margin-bottom: 20px;">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707 0-.59.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- Divider -->
    <div style="display: flex; align-items: center; margin-bottom: 20px; color: var(--text-subtle);">
      <div style="flex: 1; height: 1px; background: var(--border-glass);"></div>
      <span style="padding: 0 12px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);">or sign in with email</span>
      <div style="flex: 1; height: 1px; background: var(--border-glass);"></div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-username"><i class="fa-regular fa-user"></i> Username or Email</label>
        <input type="text" id="login-username" class="form-control" placeholder="Enter username or email" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 42px;">
          <button type="button" id="toggle-password-btn" title="Show / Hide Password" style="position: absolute; right: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 4px; display: flex; align-items: center; justify-content: center; transition: var(--transition);">
            <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 14px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
      <span>Need an account? </span>
      <a href="#" onclick="showToast('Please contact your department administrator for portal registration.', 'info')" style="font-weight: 600;">Register here</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    let selectedRole = 'STUDENT';

    // Role selection tabs
    const roleTabs = document.querySelectorAll('.role-tab');
    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => {
          t.style.background = 'transparent';
          t.style.color = 'var(--text-muted)';
          t.classList.remove('active');
        });
        tab.style.background = 'var(--primary)';
        tab.style.color = '#fff';
        tab.classList.add('active');
        selectedRole = tab.getAttribute('data-role');
      });
    });

    // Show / Hide Password Toggle
    const passwordInput = document.getElementById('login-password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordIcon.classList.remove('fa-eye');
        togglePasswordIcon.classList.add('fa-eye-slash');
        togglePasswordBtn.style.color = 'var(--primary-light)';
      } else {
        passwordInput.type = 'password';
        togglePasswordIcon.classList.remove('fa-eye-slash');
        togglePasswordIcon.classList.add('fa-eye');
        togglePasswordBtn.style.color = 'var(--text-muted)';
      }
    });

    // Continue with Google Handler
    document.getElementById('google-login-btn').addEventListener('click', () => {
      showToast('Connecting with Google Workspace...', 'info');

      setTimeout(() => {
        // Authenticate as Google user based on selected role
        let googleUser = {
          id: 4,
          username: 'student_google',
          fullName: 'Google User (Alex Morgan)',
          email: 'alex.morgan@gmail.com',
          role: selectedRole,
          department: 'Computer Science & Engineering',
          rollNumber: selectedRole === 'STUDENT' ? 'CS2024-042' : (selectedRole === 'FACULTY' ? 'FAC-CS-101' : 'ADM-001'),
          semester: selectedRole === 'STUDENT' ? 5 : 0,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'
        };

        if (selectedRole === 'FACULTY') {
          googleUser.fullName = 'Prof. Sarah Jenkins (Google)';
          googleUser.email = 's.jenkins@gmail.com';
        } else if (selectedRole === 'ADMIN') {
          googleUser.fullName = 'Dr. Alistair Vance (Google Admin)';
          googleUser.email = 'admin@campusai.edu';
        }

        AuthState.setUser(googleUser);
        localStorage.setItem('campusai_token', 'google-oauth2-token-' + Date.now());

        showToast(`Google Sign-In verified! Welcome, ${googleUser.fullName}!`, 'success');

        setTimeout(() => {
          if (selectedRole === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else if (selectedRole === 'FACULTY') {
            window.location.href = 'faculty-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 600);
      }, 700);
    });

    // Email/Password Form Submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        showToast('Please enter both username and password.', 'error');
        return;
      }

      showToast('Authenticating with CampusAI...', 'info');

      const resp = await apiRequest('/auth/login', 'POST', {
        username,
        password,
        role: selectedRole
      });

      if (resp && resp.user) {
        AuthState.setUser(resp.user);
        if (resp.token) localStorage.setItem('campusai_token', resp.token);

        showToast(`Welcome, ${resp.user.fullName}! Redirecting...`, 'success');

        setTimeout(() => {
          if (resp.user.role === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else if (resp.user.role === 'FACULTY') {
            window.location.href = 'faculty-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 800);
      } else {
        showToast('Login failed. Please check credentials.', 'error');
      }
    });
  </script>
</body>
</html>
