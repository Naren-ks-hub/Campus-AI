<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal - CampusAI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div class="glass-card" style="width: 100%; max-width: 460px; padding: 36px; position: relative;">
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" class="brand" style="justify-content: center; margin-bottom: 12px;">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span>Campus<span class="gradient-text">AI</span></span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your smart campus dashboard</p>
    </div>

    <!-- Role Selection Tabs -->
    <div style="display: flex; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 1px solid var(--border-glass);">
      <button class="role-tab active" data-role="STUDENT" style="flex: 1; padding: 8px; border: none; background: var(--primary); color: #fff; font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-user-graduate"></i> Student
      </button>
      <button class="role-tab" data-role="FACULTY" style="flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-chalkboard-user"></i> Faculty
      </button>
      <button class="role-tab" data-role="ADMIN" style="flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </button>
    </div>

    <!-- 1-Click Demo Logins -->
    <div style="margin-bottom: 20px; padding: 12px; background: rgba(99, 102, 241, 0.08); border-radius: var(--radius-sm); border: 1px dashed var(--primary-glow);">
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--primary-light); margin-bottom: 8px; text-transform: uppercase;">
        <i class="fa-solid fa-bolt"></i> Quick Demo Access:
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('student_alex', 'student123', 'STUDENT')">
          Alex Morgan (Student)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('faculty_smith', 'faculty123', 'FACULTY')">
          Prof. Jenkins (Faculty)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('admin', 'admin123', 'ADMIN')">
          Dr. Vance (Admin)
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-username"><i class="fa-regular fa-user"></i> Username or Email</label>
        <input type="text" id="login-username" class="form-control" placeholder="Enter username (e.g., student_alex)" required value="student_alex">
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="student123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
      <span>Need an account? </span>
      <a href="#" onclick="showToast('Contact administrator or use demo logins above.', 'info')" style="font-weight: 600;">Register here</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    let selectedRole = 'STUDENT';

    // Handle tab switching
    const roleTabs = document.querySelectorAll('.role-tab');
    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => {
          t.style.background = 'transparent';
          t.style.color = 'var(--text-muted)';
          t.classList.remove('active');
        });
        tab.style.background = 'var(--primary)';
        tab.style.color = '#fff';
        tab.classList.add('active');
        selectedRole = tab.getAttribute('data-role');

        if (selectedRole === 'STUDENT') {
          setDemoCredentials('student_alex', 'student123', 'STUDENT');
        } else if (selectedRole === 'FACULTY') {
          setDemoCredentials('faculty_smith', 'faculty123', 'FACULTY');
        } else if (selectedRole === 'ADMIN') {
          setDemoCredentials('admin', 'admin123', 'ADMIN');
        }
      });
    });

    window.setDemoCredentials = function(username, password, role) {
      document.getElementById('login-username').value = username;
      document.getElementById('login-password').value = password;
      selectedRole = role;

      roleTabs.forEach(t => {
        if (t.getAttribute('data-role') === role) {
          t.style.background = 'var(--primary)';
          t.style.color = '#fff';
          t.classList.add('active');
        } else {
          t.style.background = 'transparent';
          t.style.color = 'var(--text-muted)';
          t.classList.remove('active');
        }
      });
    };

    // Form Submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      showToast('Authenticating with CampusAI...', 'info');

      const resp = await apiRequest('/auth/login', 'POST', {
        username,
        password,
        role: selectedRole
      });

      if (resp && resp.user) {
        AuthState.setUser(resp.user);
        if (resp.token) localStorage.setItem('campusai_token', resp.token);

        showToast(`Welcome back, ${resp.user.fullName}! Redirecting...`, 'success');

        setTimeout(() => {
          if (resp.user.role === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else if (resp.user.role === 'FACULTY') {
            window.location.href = 'faculty-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 800);
      } else {
        showToast('Login failed. Please check credentials.', 'error');
      }
    });
  </script>
</body>
</html>
